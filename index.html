<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1C1418;color:#FBEFF3;font-family:'Manrope',system-ui,-apple-system,sans-serif}
.page{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.hero{position:relative;height:72vh;height:72svh;min-height:420px;max-height:720px}

.btn:active{transform:scale(.98)}
.l{display:flex;align-items:center;gap:14px}
.t{font-size:20px;font-weight:800}
.ico{display:block;width:48px;height:48px;border-radius:999px;flex-shrink:0}
.flame{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;background:#2A0F1C;flex-shrink:0}
.pill{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em}
.tg{background:#FBEFF3;color:#3A1A2A}.tg .pill{background:#F29BBF;color:#2A0F1C}
